name: Weekly Meal Plan Refresh

on:
  schedule:
    - cron: '0 6 * * 0' # Every Sunday at 06:00 UTC
  workflow_dispatch:
    inputs:
      preferences_json:
        description: 'JSON copiado de Preferências (Favoritas & Bloqueadas) opcional'
        required: false
        type: string
      dry_run:
        description: 'Testar API_KEY sem substituir week-current.json'
        required: false
        default: false
        type: boolean
      backfill_images:
        description: 'Gerar fotos AI reais para receitas sem foto real (até MAX_IMAGES)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  refresh-weekly-plan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate weekly meal plan and photos (when API key is configured)
        if: ${{ inputs.backfill_images != true }}
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          API_KEY: ${{ secrets.API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MEAL_PREFERENCES_JSON: ${{ inputs.preferences_json }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ -z "$API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::API_KEY, GEMINI_API_KEY ou OPENAI_API_KEY ainda não configurada nos Secrets do repositório."
            exit 0
          fi
          if [ "$DRY_RUN" = "true" ]; then
            npm run generate-week -- --dry-run
          else
            npm run generate-week
          fi

      - name: Backfill AI food photos for missing/illustrated recipes
        if: ${{ inputs.backfill_images == true && inputs.dry_run != true }}
        env:
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          API_KEY: ${{ secrets.API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          MAX_IMAGES: '20'
        run: |
          if [ -z "$API_KEY" ] && [ -z "$GEMINI_API_KEY" ] && [ -z "$OPENAI_API_KEY" ]; then
            echo "::notice::Nenhuma API key configurada para backfill de imagens."
            exit 0
          fi
          npm run backfill-images

      - name: Run deterministic recipe validator
        run: npm run generate-week -- --validate-only

      - name: Run unit tests
        run: npm test

      - name: Build production PWA
        run: npm run build

      - name: Commit and push updated week to main
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/week-current.json public/meals/
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "chore(meals): refresh weekly meal plan (PT-PT)"
          git push
